name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions needed for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip release-please's own version-bump commit — that commit triggers
    # a deployment inside release-please.yml after the release is fully written.
    # Running here in parallel would race and deploy the pre-bump state.
    if: "!startsWith(github.event.head_commit.message, 'chore(main): release')"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject version from version.txt into index.html
        run: |
          VERSION=$(cat version.txt)
          sed -i "s|<!-- x-release-please-start-version -->.*<!-- x-release-please-end-version -->|<!-- x-release-please-start-version -->v${VERSION}<!-- x-release-please-end-version -->|" index.html
          echo "Deployed version: v${VERSION}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
